name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - name: Syntax + content guard + link check
        run: npm run check
      - name: HTML validation
        run: npx --yes html-validate@8 public/index.html public/404.html
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    name: Terraform fmt/validate + KV ids match wrangler.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_version: "1.15.8", terraform_wrapper: false }
      - name: fmt
        run: terraform -chdir=terraform fmt -check -recursive -diff
      - name: validate (no backend/state needed)
        run: terraform -chdir=terraform init -backend=false -input=false >/dev/null && terraform -chdir=terraform validate
      - name: KV namespace ids in wrangler.toml match the ids Terraform manages
        run: |
          set -e
          prod_w=$(awk '/^\[\[kv_namespaces\]\]/{f=1} f&&/^id/{gsub(/[" ]/,"",$3);print $3;exit}' wrangler.toml)
          prev_w=$(awk '/^\[\[env.preview.kv_namespaces\]\]/{f=1} f&&/^id/{gsub(/[" ]/,"",$3);print $3;exit}' wrangler.toml)
          prod_t=$(grep -A1 'cloudflare_workers_kv_namespace.leads$' terraform/imports.tf | grep -o '/[a-f0-9]\{32\}' | tr -d /)
          prev_t=$(grep -A1 'cloudflare_workers_kv_namespace.leads_preview' terraform/imports.tf | grep -o '/[a-f0-9]\{32\}' | tr -d /)
          echo "wrangler prod=$prod_w preview=$prev_w | terraform prod=$prod_t preview=$prev_t"
          [ -n "$prod_w" ] && [ "$prod_w" = "$prod_t" ] || { echo "::error file=wrangler.toml::production KV id differs from terraform/imports.tf"; exit 1; }
          [ -n "$prev_w" ] && [ "$prev_w" = "$prev_t" ] || { echo "::error file=wrangler.toml::preview KV id differs from terraform/imports.tf"; exit 1; }

  smoke:
    name: Smoke test (wrangler pages dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - name: Start local Pages dev server
        run: |
          echo '{"commit":"ci-local"}' > public/version.json
          (npx wrangler pages dev ./public --port 8788 --ip 127.0.0.1 > wrangler-dev.log 2>&1 &)
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8788/ && break; sleep 1; done
          curl -s -o /dev/null -w 'dev server up: %{http_code}\n' http://127.0.0.1:8788/
      - name: Run smoke test (with lead write round-trip against local KV)
        run: SMOKE_WRITE=1 scripts/smoke.sh http://127.0.0.1:8788 ci-local
      - if: failure()
        run: cat wrangler-dev.log

  preview:
    name: Preview deploy + Lighthouse
    runs-on: ubuntu-latest
    needs: [checks]
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - name: Deploy preview to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '{"commit":"%s","built":"%s"}\n' "${{ github.event.pull_request.head.sha }}" "$(date -u +%FT%TZ)" > public/version.json
          npx wrangler pages deploy ./public --project-name=fennerframework --branch="${{ github.head_ref }}" --commit-hash=${{ github.event.pull_request.head.sha }} 2>&1 | tee deploy.log
          URL=$(grep -o 'https://[a-z0-9.-]*\.fennerframework\.pages\.dev' deploy.log | head -1)
          [ -n "$URL" ] || { echo "no preview URL found"; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Smoke test the preview (writes one test lead to the *preview* KV; retries while the deployment propagates)
        run: |
          for i in $(seq 1 12); do
            if SMOKE_WRITE=1 scripts/smoke.sh "${{ steps.deploy.outputs.url }}" "${{ github.event.pull_request.head.sha }}"; then exit 0; fi
            echo "preview not ready yet, retrying in 10s ($i/12)"; sleep 10
          done
          echo "::error::preview never passed smoke"; exit 1
      - name: Lighthouse config
        run: |
          cat > lighthouserc.json <<JSON
          { "ci": { "collect": { "url": ["${{ steps.deploy.outputs.url }}/"], "numberOfRuns": 1, "settings": { "preset": "desktop" } },
                    "assert": { "assertions": {
                      "categories:performance": ["error", { "minScore": 0.9 }],
                      "categories:accessibility": ["error", { "minScore": 0.95 }],
                      "categories:best-practices": ["warn", { "minScore": 0.9 }],
                      "categories:seo": ["error", { "minScore": 0.9 }],
                      "total-byte-weight": ["error", { "maxNumericValue": 400000 }] } },
                    "upload": { "target": "filesystem", "outputDir": "lhci" } } }
          JSON
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.14 autorun --config=lighthouserc.json
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: lighthouse-report, path: lhci, if-no-files-found: ignore, retention-days: 14 }
      - name: Comment preview URL on PR
        uses: actions/github-script@v9
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- preview-url -->';
            const body = `${marker}🔍 **Preview deployed:** ${url}\n\nLighthouse report is attached to the workflow run as an artifact.`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const prev = comments.find(c => c.body && c.body.startsWith(marker));
            if (prev) await github.rest.issues.updateComment({ ...context.repo, comment_id: prev.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
